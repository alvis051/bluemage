name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR supersedes the old run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - name: Tests, with a coverage floor
        run: >-
          uv run pytest -v
          --junitxml=reports/junit.xml
          --cov --cov-report=term --cov-report=xml:reports/coverage.xml
        # The floor is fail_under in pyproject.toml.

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/

      - name: Smoke — migrate and seed
        run: |
          uv run alembic -c server/alembic.ini upgrade head
          uv run bluemage seed
        env:
          BLUEMAGE_DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-extras --dev
      - run: cd frontend && npm ci

      - name: API types are in sync with the backend
        run: |
          uv run bluemage openapi > openapi.json
          cd frontend && npm run gen:types
          git diff --exit-code src/api/schema.d.ts
        # A backend schema change the frontend has not absorbed fails here.

      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit
          path: frontend/reports/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
