[project]
name = "bluemage-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "plugin", "worker"]

[tool.uv.sources]
bluemage = { workspace = true }
pytest-bluemage = { workspace = true }
bluemage-worker = { workspace = true }

[dependency-groups]
dev = [
    "bluemage",
    "pytest-bluemage",
    "bluemage-worker",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "plugin/tests", "worker/tests"]

[tool.coverage.run]
source_pkgs = ["bluemage", "pytest_bluemage", "bluemage_worker"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
